# CatBoost model configuration.
# CatBoost receives the contract's categorical columns natively; no target
# encoding is applied by the wrapper.
# E4 adds `tuning.base_params` and samples `tuning.search_space`.

model:
  name: catboost
  params:
    iterations: 300
    depth: 6
    learning_rate: 0.1
  runtime:
    thread_count: -1
  tuning:
    early_stopping_rounds: 100
    base_params:
      iterations: 2000
    search_space:
      depth:
        type: int
        low: 4
        high: 10
      learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true
      l2_leaf_reg:
        type: float
        low: 1.0e-3
        high: 30.0
        log: true
      bagging_temperature:
        type: float
        low: 0.0
        high: 1.0
      border_count:
        type: int
        low: 64
        high: 255
